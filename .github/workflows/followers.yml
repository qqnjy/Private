name: Daily Follower Flows

on:
  schedule:
    - cron: '0 8 * * *' # 台灣時間 16:00，待 Meta 前一日區間結束後取數
  workflow_dispatch:

permissions:
  contents: read

jobs:
  follower_flows:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: follower-flow-snapshot
      cancel-in-progress: false
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install follower collector dependencies
        run: pip install httpx==0.28.1 python-dotenv==1.2.2
      - name: Verify reporting logic
        working-directory: backend
        run: python -m unittest test_follower_insights -v
      - name: Collect recent completed days
        working-directory: backend
        env:
          FB_GRAPH_TOKEN: ${{ secrets.FB_GRAPH_TOKEN }}
        run: python collect_follower_insights.py
      - name: Save follower snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/follower_daily.json
          if ! git diff --cached --quiet; then
            git commit -m "Update project daily follower flow snapshots"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
